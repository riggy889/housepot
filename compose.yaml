name: housepot

x-base: &base
  image: housepot-php
  build:
    context: docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  volumes:
    - .:/var/www/html
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  app:
    <<: *base
    depends_on:
      pgsql:
        condition: service_healthy

  queue:
    <<: *base
    command: php artisan queue:listen --tries=3
    restart: unless-stopped
    depends_on:
      pgsql:
        condition: service_healthy

  reverb:
    <<: *base
    command: php artisan reverb:start --host=0.0.0.0 --port=8080 --debug
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      pgsql:
        condition: service_healthy

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/pgsql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: nginx:1.30.6-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  node:
    image: node:24-bookworm-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html

volumes:
  pgdata: